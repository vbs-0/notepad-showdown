[package]
name = "notepad"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.19"

[lib]
name = "notepad"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "notepad"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
